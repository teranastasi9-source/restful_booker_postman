name: Tests
# run-name gives each individual run a title matching what actually triggered it, shown in the
# Actions run list and when picking "Run workflow" manually - the static name above doesn't
# distinguish push/PR from a scheduled/manual run, unlike this. Same pattern as the
# playwright_ui_automation sibling project's workflow.
run-name: >-
  ${{ github.event_name == 'schedule' && 'Weekly scheduled tests + Pages deploy'
   || github.event_name == 'workflow_dispatch' && 'Tests + Pages deploy (manual)'
   || format('Tests - {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Once a week (Monday), independent of anyone pushing - catches drift caused by the
    # public restful-booker.herokuapp.com API itself, not just collection changes. Was daily
    # until 2026-08-05: the playwright_ui_automation sibling project's OrangeHRM demo had a
    # genuinely bad evening that night (verified directly, independent of CI), producing
    # several days' worth of red runs to triage for no real signal - dropped all three
    # portfolio repos to weekly together rather than waiting to see if this one hits the same
    # pattern. Run on demand via workflow_dispatch any time a fresh report is actually needed.
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

jobs:
  test:
    name: Run Postman collection (Newman)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g newman newman-reporter-htmlextra
      - name: Run the integration workflow collection
        run: |
          # Retries once on failure: verified 2026-08-03 that a real CI failure here
          # (assertion "expected 2256 to be below 1000" on the
          # update_booking_expired_token_mocked request) was a one-off latency spike
          # from Postman's own mock server, not a real regression - the very next run,
          # same collection, passed 214/214 with max response time back under 900ms.
          # Not a blanket retry-until-green: only this one step, only once.
          for attempt in 1 2; do
            if newman run RESTful_Booker.IntegrationWorkflows_07.json \
              -r htmlextra,json \
              --reporter-htmlextra-export test_reports/report_IntegrationWorkflows_07.html \
              --reporter-json-export test_reports/report_IntegrationWorkflows_07.json \
              --timeout 15000 \
              --delay-request 200; then
              break
            elif [ "$attempt" -eq 2 ]; then
              exit 1
            else
              echo "Attempt $attempt failed - retrying once (see comment above)."
              sleep 5
            fi
          done
      - name: Run the individual endpoint collection
        # Same retry policy as the workflow collection above, for the same reason - both hit
        # the same shared, public restful-booker.herokuapp.com instance and are subject to the
        # same occasional latency/availability blips. Verified directly (2026-08-10): 170/170
        # assertions pass consistently across repeated runs, so a retry here is a safety net
        # for shared-API noise, not a mask for a flaky test.
        run: |
          for attempt in 1 2; do
            if newman run RESTful_Booker.Individual_collections_01_06.json \
              -r htmlextra \
              --reporter-htmlextra-export test_reports/report_Individual_collections_01_06.html \
              --timeout 15000 \
              --delay-request 200; then
              break
            elif [ "$attempt" -eq 2 ]; then
              exit 1
            else
              echo "Attempt $attempt failed - retrying once (see comment above)."
              sleep 5
            fi
          done
      - name: Update assertions badge
        # Dynamic instead of hand-maintained - reads the assertion count straight out of the
        # JSON reporter output from the integration-workflow run above (no extra API calls).
        # Only commits back when the count actually changed, and [skip ci] on that commit
        # avoids re-triggering this whole workflow on its own badge-update push. Same pattern
        # as the playwright_ui_automation and restful_booker_automation sibling projects.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COUNT=$(jq '.run.stats.assertions.total' test_reports/report_IntegrationWorkflows_07.json)
          mkdir -p .github/badges
          echo "{\"schemaVersion\":1,\"label\":\"assertions\",\"message\":\"$COUNT\",\"color\":\"brightgreen\"}" > .github/badges/assertions.json
          if ! git diff --quiet -- .github/badges/assertions.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/badges/assertions.json
            git commit -m "chore: update assertions badge to $COUNT [skip ci]"
            git push
          else
            echo "Assertion count unchanged ($COUNT) - nothing to commit."
          fi
      - name: Upload report (always, so failures are inspectable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test_reports/
          retention-days: 14
      - name: Open an issue on nightly failure
        # Only for the scheduled run, not push/PR/workflow_dispatch - those are
        # already being watched live. Not a verdict on whether this is a real
        # regression or an external hiccup - just a "don't let this go
        # unnoticed" safety net (the retry above already absorbs the one known
        # flake pattern, so a failure that reaches here is more likely real).
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly Newman run failed (run #${context.runNumber})`,
              body: [
                `The scheduled nightly Newman run failed, even after the automatic retry.`,
                ``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Not yet triaged - see the README's Troubleshooting section for the one`,
                `known flake pattern (already retried automatically above); if it's not`,
                `that, this is worth a closer look.`
              ].join("\n"),
              labels: ["bug", "ci-failure"]
            })

  pages:
    name: Deploy latest report to GitHub Pages
    needs: test
    # On push to main, schedule, or manual dispatch - not PRs, Pages should reflect main's
    # state, not a preview branch. Also runs on schedule/workflow_dispatch (fixed 2026-08-05:
    # previously only push, which silently broke the "run on demand via workflow_dispatch for
    # a fresh report" promise made when the schedule moved from daily to weekly - test itself
    # has no such restriction, so tests would run on a manual dispatch but never actually
    # reach Pages). Requires Pages enabled once in repo Settings > Pages > Source:
    # "GitHub Actions" (a one-time manual step, not something a workflow file can set).
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-report
          path: test_reports/
      - name: Stage both reports as the Pages site
        # newman-reporter-htmlextra produces self-contained single HTML files (CSS/JS
        # inlined), so each can be served as-is. IntegrationWorkflows_07 stays at the site
        # root (index.html) since that's the URL already linked from the README - the
        # individual-collection report is added alongside it, not replacing it. A small nav
        # bar is injected into each so a visitor landing on either one can find the other -
        # same pattern used in the playwright_ui_automation sibling project's Pages site.
        run: |
          mkdir -p _site
          cp test_reports/report_IntegrationWorkflows_07.html _site/index.html
          cp test_reports/report_Individual_collections_01_06.html _site/individual-collections.html

          NAV_STYLE='background:#24292f;color:#c9d1d9;padding:10px 16px;font-family:-apple-system,sans-serif;font-size:14px'
          LINK_STYLE='color:#79c0ff;margin-right:14px'
          CUR_STYLE='color:#fff;margin-right:14px'

          NAV_WORKFLOWS="<div style=\"$NAV_STYLE\">Collection: <strong style=\"$CUR_STYLE\">Integration Workflows (07)</strong><a href=\"individual-collections.html\" style=\"$LINK_STYLE\">Individual Collections (01-06)</a></div>"
          NAV_INDIVIDUAL="<div style=\"$NAV_STYLE\">Collection: <a href=\"./\" style=\"$LINK_STYLE\">Integration Workflows (07)</a><strong style=\"$CUR_STYLE\">Individual Collections (01-06)</strong></div>"

          sed -i "s|<body>|<body>${NAV_WORKFLOWS}|" _site/index.html
          sed -i "s|<body>|<body>${NAV_INDIVIDUAL}|" _site/individual-collections.html
      - name: Delete stale github-pages artifact from a previous attempt, if any
        # Re-running this workflow leaves the previous attempt's already-uploaded
        # "github-pages" artifact in place - upload-pages-artifact always uses that fixed name,
        # so a second attempt collides with it and deploy-pages fails with "Multiple artifacts
        # named github-pages... Artifact count is 2" (same issue verified 2026-08-05 in the
        # playwright_ui_automation sibling project). No-op on a normal first attempt.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' |
          while read -r artifact_id; do
            echo "Deleting stale github-pages artifact $artifact_id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
