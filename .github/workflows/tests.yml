name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Once a day, independent of anyone pushing - catches drift caused by the
    # public restful-booker.herokuapp.com API itself, not just collection changes.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  test:
    name: Run Postman collection (Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g newman newman-reporter-htmlextra
      - name: Run the integration workflow collection
        run: |
          newman run RESTful_Booker.IntegrationWorkflows_07.json \
            -r htmlextra \
            --reporter-htmlextra-export test_reports/report_IntegrationWorkflows_07.html \
            --timeout 15000 \
            --delay-request 200
      - name: Upload report (always, so failures are inspectable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test_reports/
          retention-days: 14
